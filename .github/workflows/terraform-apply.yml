name: Terraform Apply

on:
  push:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        default: "dev"
        type: choice
        options: [dev, stage, prod, bootstrap]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-apply-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    env:
      TF_ENV: ${{ inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    defaults:
      run:
        working-directory: ${{ (inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev')) == 'bootstrap' && 'terraform/bootstrap' || format('terraform/environments/{0}', inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_APPLIER_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

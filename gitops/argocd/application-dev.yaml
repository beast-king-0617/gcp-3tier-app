# Example Application for the dev cluster.
# Prefer Terraform bootstrap (modules/argocd) which creates this with the correct repo URL.
# Keep this file as the GitOps source of truth if using App-of-Apps instead of Terraform manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: myapp
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: myapp
  source:
    repoURL: REPLACE_GIT_REPO_URL
    targetRevision: develop
    path: gitops/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

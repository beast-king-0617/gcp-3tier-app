apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  parentRefs:
    - name: external-https
      namespace: gateway-system
      sectionName: https
  hostnames:
    - REPLACE_HOSTNAME
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          namespace: frontend
          port: 80

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-api
  namespace: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  parentRefs:
    - name: external-https
      namespace: gateway-system
      sectionName: https
  hostnames:
    - REPLACE_HOSTNAME
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          namespace: backend
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: backend
          namespace: backend
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /ready
      backendRefs:
        - name: backend
          namespace: backend
          port: 8080

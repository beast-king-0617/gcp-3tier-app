# HTTP → HTTPS redirect (listener "http" on the Gateway)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway-system
  labels:
    app.kubernetes.io/name: https-redirect
spec:
  parentRefs:
    - name: external-https
      namespace: gateway-system
      sectionName: http
  hostnames:
    - REPLACE_HOSTNAME
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

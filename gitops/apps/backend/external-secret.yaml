# Replaces git-committed Secret values. ESO syncs DB_PASSWORD from Secret Manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-db
  namespace: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: backend-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        # Override per env via Kustomize patch — default matches Terraform secret id pattern.
        key: myapp-dev-db-password

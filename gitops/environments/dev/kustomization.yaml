apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/namespaces.yaml
  - ../../apps/frontend
  - ../../apps/backend
  - ../../infrastructure/gateway

# Replace placeholders after terraform apply using values from:
#   terraform output gateway_ip_name
#   terraform output certificate_map_name
#   terraform output app_hostname
replacements: []

patches:
  - target:
      kind: Gateway
      name: external-https
    patch: |-
      - op: replace
        path: /metadata/annotations/networking.gke.io~1addresses
        value: myapp-dev-gw-ip
      - op: replace
        path: /metadata/annotations/networking.gke.io~1certmap
        value: myapp-dev-certmap
  - target:
      kind: HTTPRoute
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: dev.myapp.example.com
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/DB_HOST
        value: REPLACE_CLOUDSQL_PRIVATE_IP

images:
  - name: us-central1-docker.pkg.dev/myapp-dev/myapp-dev-frontend/frontend
    newName: us-central1-docker.pkg.dev/myapp-dev/myapp-dev-frontend/frontend
    newTag: REPLACE_GIT_SHA
  - name: us-central1-docker.pkg.dev/myapp-dev/myapp-dev-backend/backend
    newName: us-central1-docker.pkg.dev/myapp-dev/myapp-dev-backend/backend
    newTag: REPLACE_GIT_SHA
